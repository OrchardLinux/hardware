# iPad 7 (Cellular) — J172: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j172"
name = "iPad 7 (Cellular)"
apple_products = ["iPad7,12"]
dt_compatible = ["apple,j172"]

# BDID: ApBoardID/ApChipID of the j172ap identities in the 22H384 (iPadOS 18.7.11) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPad7,12 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x1e

# USB product of the Orchard recovery system ("<Board> Recovery").
[match.linux]
product = "J172 Recovery"

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no j172 launcher release exists. Mirrors the j71b URL pattern.
launch_manifest = "https://github.com/OrchardLinux/hardware/releases/latest/download/j172-launcher.boot.toml"

[kernel]
platform = "apple"     # kernel/series/apple, kernel/configs/apple
dtb = "t8010-j172"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = false # No qualified install path on this board yet.
wifi = true # Station mode validated on J172 by Pauli1Go (HoolockLinux, rudderb YSBU m-2.5); not yet in Orchard.
usb_serial = false # No Orchard launcher/gadget validated on this board yet.
usb_network = false
