# iPad 7 (Wi-Fi) — J171: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j171"
name = "iPad 7 (Wi-Fi)"
apple_products = ["iPad7,11"]
dt_compatible = ["apple,j171"]

# BDID: ApBoardID/ApChipID of the j171ap identities in the 22H384 (iPadOS 18.7.11) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPad7,11 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x1c

# USB product of the Orchard recovery system ("<Board> Recovery").
[match.linux]
product = "J171 Recovery"

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no j171 launcher release exists. Mirrors the j71b URL pattern.
launch_manifest = "https://github.com/OrchardLinux/hardware/releases/latest/download/j171-apple-launcher.boot.toml"

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j171"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = true
status = "experimental"
caveats = [
  "Bluetooth needs its module vendor (Murata or USI) chosen per unit; not loaded yet.",
]
wifi = false # DT board-type is apple,rudderb but Apple's J171 ADT says module-instance "ruddera"; unvalidated.
usb_serial = false # No Orchard launcher/gadget validated on this board yet.
usb_network = false

# States: working, partial, untested, missing, none (features.toml).
[features]
display = "untested"
touch = "untested"
wifi = "untested"
bluetooth = "missing"
storage = "untested"
battery = "untested"
charging = "missing"
backlight = "untested"
buttons = "untested"
audio = "missing"
camera = "missing"
cellular = "none"
suspend = "missing"
gpu = "missing"
