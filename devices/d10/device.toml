# iPhone 7 (Qualcomm) — D10: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "d10"
name = "iPhone 7 (Qualcomm)"
apple_products = ["iPhone9,1"]
dt_compatible = ["apple,d10"]

# BDID: ApBoardID/ApChipID of the d10ap identities in the 19H422 (iOS 15.8.8) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPhone9,1 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x08

# USB product of the Orchard recovery system ("<Board> Recovery").
[match.linux]
product = "D10 Recovery"

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no d10 launcher release exists. Mirrors the j71b URL pattern.
launch_manifest = "https://github.com/OrchardLinux/hardware/releases/latest/download/d10-launcher.boot.toml"

[kernel]
platform = "apple"     # kernel/series/apple, kernel/configs/apple
dtb = "t8010-d10"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = false # No qualified install path on this board yet.
wifi = false # The t8010-d10 DT has no Wi-Fi node.
usb_serial = false # No Orchard launcher/gadget validated on this board yet.
usb_network = false
