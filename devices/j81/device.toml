# iPad Air 2 (Wi-Fi) — J81: hardware identity, boot assets and firmware recipe.
# iPad Air 2 support comes from Martin Puškáč's port (mattonik/ipad-nixos), handed to Orchard
# by micro23 (micro23/ipadair2-omarchy).
schema = 1
kind = "hardware.device"

[device]
profile = "j81"
name = "iPad Air 2 (Wi-Fi)"
apple_products = ["iPad5,3"]
dt_compatible = ["apple,j81"]

# BDID: ApChipID/ApBoardID of the j81ap identities in the 19H422 (iPadOS 15.8.8) BuildManifest.plist.
[match.dfu]
chip = 0x7001
board = 0x06

# USB product of the Orchard recovery system ("<Board> Recovery").
[match.linux]
product = "J81 Recovery"

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"  # kernel/series/apple-4k, kernel/configs/apple-4k: A8X has no 16 KiB pages
dtb = "t7001-j81"       # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = false # No storage driver for the A8X's NVMe (ANS1) yet: RAM boot only.
status = "experimental"
caveats = [
  "RAM boot only: the internal storage is not supported yet.",
  "Wi-Fi module rieslinga (BCM4350).",
  "Boot with Hoolock's prebuilt Pongo (orchard build --pongo FILE); Orchard's own Pongo does not boot on the A8X yet. See docs/integration/j81.md.",
  "Display, Wi-Fi, battery, backlight and buttons seen working on a J81 RAM boot on 2026-10-29.",
]
wifi = true # Scan, association, DHCP and gateway ping seen working on a J81.
usb_serial = true
usb_network = true

# States: working, partial, untested, missing, none (features.toml).
[features]
display = "working"
touch = "untested"
wifi = "working"
bluetooth = "untested"
storage = "missing"
battery = "working"
charging = "missing"
backlight = "working"
buttons = "working"
audio = "missing"
camera = "missing"
cellular = "none"
suspend = "missing"
gpu = "missing"
