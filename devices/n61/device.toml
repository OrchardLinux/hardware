# iPhone 6 (N61AP): experimental A8 RAM-boot recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "n61"
name = "iPhone 6"
apple_products = ["iPhone7,2"]
dt_compatible = ["apple,n61"]

# Observed on N61AP in DFU; T7000 identifies itself as CPID 7000.
[match.dfu]
chip = 0x7000
board = 0x06

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"
dtb = "t7000-n61"

# The RAM shell uses public components; touch firmware is extracted privately.
[firmware]
recipe = "firmware.json"

[support]
install = false
status = "experimental"
caveats = [
  "The minimal-boot RAM image reached the USB serial shell with a visible framebuffer console using PongoOS 2.6.3-e98323f8 bundled with palera1n 2.4.",
  "Physical taps and swipes produced evdev contacts and releases after loading apple_z2 with the private recipe-matched firmware; earlier desktop results are recorded as history in docs/n61-bringup.md.",
  "Bluetooth, Wi-Fi and internal storage are unqualified; installation remains disabled.",
]
wifi = false
usb_serial = true # The minimal-boot ACM shell accepted commands on the phone.
usb_network = false # minimal-boot exercises USB ACM; ECM needs a separate runtime test.

[features]
display = "working" # The minimal-boot framebuffer console was visible on the LCD.
touch = "working" # Taps and swipes produced raw evdev contacts/releases in minimal-boot.
wifi = "missing"
bluetooth = "missing"
storage = "missing"
battery = "untested"
charging = "missing"
backlight = "untested"
buttons = "untested"
audio = "missing"
camera = "missing"
cellular = "missing"
suspend = "missing"
gpu = "missing"
