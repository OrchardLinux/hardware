# iPhone 7 Plus (Intel) — D111: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "d111"
name = "iPhone 7 Plus (Intel)"
apple_products = ["iPhone9,4"]
dt_compatible = ["apple,d111"]

# BDID: ApBoardID/ApChipID of the d111ap identities in the 19H422 (iOS 15.8.8) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPhone9,4 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x0e

# USB product of the Orchard recovery system ("<Board> Recovery").
[match.linux]
product = "D111 Recovery"

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no d111 launcher release exists. Mirrors the j71b URL pattern.
launch_manifest = "https://github.com/OrchardLinux/hardware/releases/latest/download/d111-launcher.boot.toml"

[kernel]
platform = "apple"     # kernel/series/apple, kernel/configs/apple
dtb = "t8010-d111"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = true # Experimental: never installed on this model yet.
wifi = true # Station mode validated on D111 by Pauli1Go (HoolockLinux, olaf PRNL m-5.7); AP mode froze; not yet in Orchard.
usb_serial = false # No Orchard launcher/gadget validated on this board yet.
usb_network = false
