# iPad 6 Wi-Fi (J71b): hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j71b"
name = "iPad 6 (Wi-Fi)"
apple_products = ["iPad7,5"]
dt_compatible = ["apple,j71b"]

[match.dfu]
chip = 0x8010
board = 0x18

[match.linux]
product = "J71b Recovery"

[boot]
methods = ["checkm8-pongo"]
launch_manifest = "https://github.com/OrchardLinux/hardware/releases/latest/download/j71b-launcher.boot.toml"

[kernel]
platform = "apple"     # kernel/series/apple, kernel/configs/apple
dtb = "t8010-j71b"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = true
status = "supported"
limitations = []
wifi = true # Static support; provisioning requires runtime-confirmed availability.
usb_serial = true
usb_network = true
