# iPad 6 Wi-Fi (J71b): hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j71b"
name = "iPad 6 (Wi-Fi)"
apple_products = ["iPad7,5"]
dt_compatible = ["apple,j71b"]

[match.dfu]
chip = 0x8010
board = 0x18

[match.linux]
recovery = true

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j71b"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
install = true
status = "supported"
caveats = [
  "Apple chargers and USB-C sources charge at up to 2.4 A; computers, hubs and other USB-A chargers at 500 mA, which may not keep up with heavy use.",
]
wifi = true # Static support; provisioning requires runtime-confirmed availability.
usb_serial = true
usb_network = true

# States: working, partial, untested, missing, none (features.toml).
[features]
display = "working"
touch = "working"
wifi = "working"
bluetooth = "working"
storage = "working"
battery = "working"
charging = "working"
backlight = "working"
buttons = "untested"
audio = "missing"
camera = "missing"
cellular = "none"
suspend = "missing"
gpu = "missing"
