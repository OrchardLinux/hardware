# payload.toml: how `orchard build` turns this directory into a RAM payload.
#
# A payload is `init` (the first program the kernel runs) plus the files under
# `rootfs/`. `orchard build` makes one for every board of a platform; `orchard
# run` builds what is missing and boots the attached board. This file is
# optional; without it every setting has its default. It describes the payload
# only, never which board it is for.

# By default every payload also gets the USB session helper
# (/usr/libexec/orchard/usb-session: USB networking and SSH), which `init` can
# start for `orchard shell`, `exec`, `push` and `pull`. This example keeps to
# the USB serial shell, so it leaves the helper out.
transport = false
