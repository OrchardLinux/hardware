[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard"
version = "0.2.0"
description = "Linux on Apple devices: hardware support, recipes, and the orchard tool"
readme = "README.md"
license = "GPL-2.0-only AND GPL-2.0-or-later AND MIT AND ISC"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11"
# The core (install, launch) needs only the standard library; jsonschema
# validates manifests and descriptors in development and release CI.
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4.25,<5"]

[project.urls]
Repository = "https://github.com/OrchardLinux/orchard"
Documentation = "https://github.com/OrchardLinux/orchard/blob/main/BUILD.md"
Issues = "https://github.com/OrchardLinux/orchard/issues"

[project.scripts]
orchard = "orchard.command:main"
orch = "orchard.command:main"

# Only src/orchard is a Python package. Device data, recipes and device-side
# code are files of this checkout, which orchard.hardware.ROOT points at, so
# the tool runs from a checkout (an editable install), not from a wheel.
[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchard = ["py.typed", "usb-session"]

[dependency-groups]
dev = ["mypy==1.18.2", "jsonschema>=4.25,<5"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/orchard/contracts.py", "src/orchard/devices.py", "src/orchard/apple/device.py", "src/orchard/service.py", "src/orchard/command.py", "tests/typecheck_adapter.py"]
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["orchard.contracts", "orchard.devices", "orchard.apple.device"]
disallow_untyped_defs = true
