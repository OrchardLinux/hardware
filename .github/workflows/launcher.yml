name: Build shared launcher
on:
  workflow_dispatch:
    inputs:
      hardware_tag:
        description: Published hardware release containing the wheel and component bundle
        required: true
        default: v0.1.10
      cli_tag:
        description: Published compatible CLI release
        required: true
        default: v0.1.10
      minimal_tag:
        description: Published Minimal Linux release (supplies the Alpine base and one compatible root)
        required: true
      omarchy_tag:
        description: Optional published Omarchy A release to support as well
        required: false
      hardware_run_id:
        description: Optional exact hardware CI run for first-release assembly
        required: false
      cli_run_id:
        description: Exact CLI CI run when using first-release assembly
        required: false
      minimal_run_id:
        description: Exact Minimal Linux CI run when using first-release assembly
        required: false
      omarchy_run_id:
        description: Exact Omarchy CI run when including its first-release image
        required: false
      attach_assets:
        description: Attach new launcher assets to the selected hardware release (never overwrite)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 90
    env:
      HARDWARE_TAG: ${{ inputs.hardware_tag }}
      CLI_TAG: ${{ inputs.cli_tag }}
      MINIMAL_TAG: ${{ inputs.minimal_tag }}
      OMARCHY_TAG: ${{ inputs.omarchy_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Await exact first-release image builds
        if: inputs.hardware_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MINIMAL_RUN_ID: ${{ inputs.minimal_run_id }}
          OMARCHY_RUN_ID: ${{ inputs.omarchy_run_id }}
        run: |
          [[ "$MINIMAL_RUN_ID" =~ ^[0-9]+$ ]]
          gh run watch "$MINIMAL_RUN_ID" --repo OrchardLinux/minimal-linux --interval 10 --exit-status
          if [[ -n "$OMARCHY_TAG" ]]; then
            [[ "$OMARCHY_RUN_ID" =~ ^[0-9]+$ ]]
            gh run watch "$OMARCHY_RUN_ID" --repo OrchardLinux/omarchy-a --interval 10 --exit-status
          fi
      - name: Download exact hardware build inputs
        if: inputs.hardware_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: hardware-release-assets
          path: out/hardware
          repository: OrchardLinux/hardware
          run-id: ${{ inputs.hardware_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact cli build inputs
        if: inputs.hardware_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: cli-wheel-pair
          path: out/cli
          repository: OrchardLinux/cli
          run-id: ${{ inputs.cli_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact minimal-linux build inputs
        if: inputs.hardware_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: minimal-release-assets
          path: out/minimal
          repository: OrchardLinux/minimal-linux
          run-id: ${{ inputs.minimal_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact omarchy-a build inputs
        if: inputs.hardware_run_id != '' && inputs.omarchy_tag != ''
        uses: actions/download-artifact@v4
        with:
          name: omarchy-release-assets
          path: out/omarchy
          repository: OrchardLinux/omarchy-a
          run-id: ${{ inputs.omarchy_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and install exact first-release inputs
        if: inputs.hardware_run_id != ''
        run: |
          [[ "$HARDWARE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$CLI_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MINIMAL_TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ -z "$OMARCHY_TAG" || "$OMARCHY_TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          cmp out/cli/orchard_hardware-*.whl out/hardware/orchard_hardware-*.whl
          python -m pip install --only-binary=:all: out/cli/*.whl
          python -c 'import importlib.metadata as m, os; assert "v" + m.version("orchard-hardware") == os.environ["HARDWARE_TAG"]; assert "v" + m.version("orchard-cli") == os.environ["CLI_TAG"]'
          python -m pip check
          sudo apt-get update && sudo apt-get install -y zstd
          (cd out/hardware && sha256sum --check --ignore-missing SHA256SUMS)
          (cd out/minimal && sha256sum --check --ignore-missing SHA256SUMS)
          if [[ -n "$OMARCHY_TAG" ]]; then
            (cd out/omarchy && sha256sum --check --ignore-missing SHA256SUMS)
          fi
          tar -xzf out/hardware/j71b-components.tar.gz -C out
      - name: Fetch pinned public inputs
        if: inputs.hardware_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$HARDWARE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$CLI_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MINIMAL_TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ -z "$OMARCHY_TAG" || "$OMARCHY_TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          python -m pip install --only-binary=:all: -r "https://github.com/OrchardLinux/cli/releases/download/$CLI_TAG/requirements.txt"
          python -c 'import importlib.metadata as m, os; assert "v" + m.version("orchard-hardware") == os.environ["HARDWARE_TAG"]'
          sudo apt-get update && sudo apt-get install -y zstd
          mkdir -p out/hardware out/minimal
          gh release download "$HARDWARE_TAG" --repo OrchardLinux/hardware \
            --pattern j71b-components.tar.gz --pattern SHA256SUMS --dir out/hardware
          (cd out/hardware && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf out/hardware/j71b-components.tar.gz -C out
          gh release download "$MINIMAL_TAG" --repo OrchardLinux/minimal-linux \
            --pattern rootfs.tar.gz --pattern rootfs.json --pattern build-receipt.json \
            --pattern base.tar.gz --pattern base.tar.gz.json --pattern SHA256SUMS --dir out/minimal
          (cd out/minimal && sha256sum --check --ignore-missing SHA256SUMS)
          if [[ -n "$OMARCHY_TAG" ]]; then
            mkdir -p out/omarchy
            gh release download "$OMARCHY_TAG" --repo OrchardLinux/omarchy-a \
              --pattern rootfs.tar.zst --pattern rootfs.json --pattern build-receipt.json \
              --pattern SHA256SUMS --dir out/omarchy
            (cd out/omarchy && sha256sum --check --ignore-missing SHA256SUMS)
          fi
      - name: Build and verify the shared launcher
        run: |
          python ci/launcher_inputs.py --components out/components --output out/launcher-inputs.json
          installations=(--installation out/minimal/rootfs.tar.gz out/minimal/rootfs.json out/minimal/build-receipt.json)
          if [[ -n "$OMARCHY_TAG" ]]; then
            installations+=(--installation out/omarchy/rootfs.tar.zst out/omarchy/rootfs.json out/omarchy/build-receipt.json)
          fi
          python -m orchard_hardware.image.launcher --inputs out/launcher-inputs.json \
            --quiet-boot-receipt out/components/quiet/quiet-boot.json \
            --base out/minimal/base.tar.gz --base-receipt out/minimal/base.tar.gz.json \
            "${installations[@]}" --release "${HARDWARE_TAG#v}" \
            --public-base-url "https://github.com/OrchardLinux/hardware/releases/download/$HARDWARE_TAG" \
            --output out/launcher
          # Require the paired host firmware recipe, not only the boot protocol.
          python - <<'PY'
          import os, re
          from pathlib import Path
          minimum = os.environ['CLI_TAG'].removeprefix('v')
          for name in ('boot.toml', 'j71b-launcher.boot.toml'):
              path = Path('out/launcher') / name
              text, count = re.subn(r'^min_orchard = "[^"]+"$',
                                   'min_orchard = "' + minimum + '"',
                                   path.read_text(), flags=re.MULTILINE)
              assert count == 1, 'Expected one launcher CLI requirement'
              path.write_text(text)
          PY
          mkdir -p out/publication
          cp out/launcher/recovery.bin out/launcher/pongo.bin out/launcher/j71b-launcher.boot.toml \
            out/launcher/launch.json out/publication/
          (cd out/publication && sha256sum ./* > ../launcher.SHA256SUMS && mv ../launcher.SHA256SUMS .)
          orchard resolve --boot out/launcher/boot.toml
      - name: Attest public build
        if: toJSON(github.event.repository.private) == 'false'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/publication/*
      - name: Include public attestation bundle
        if: toJSON(github.event.repository.private) == 'false'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "out/publication/hardware-launcher.sigstore.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: shared-launcher-assets
          path: out/publication/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
  attach:
    if: inputs.attach_assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shared-launcher-assets
          path: assets
      - name: Attach without replacing existing assets or publishing a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HARDWARE_TAG: ${{ inputs.hardware_tag }}
        run: gh release upload "$HARDWARE_TAG" assets/*
