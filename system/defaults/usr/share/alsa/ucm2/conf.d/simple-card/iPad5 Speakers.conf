# iPad 5 (J71, J71t, J72, J72t): the CS42L81 card of simple-audio-card
# "iPad5 Speakers" (arch/arm64/boot/dts/apple/s800x-ipad5.dtsi). alsa-lib
# finds this file by the card's driver and long name.
Syntax 4

SectionUseCase."HiFi" {
	Comment "Speakers and microphone"
