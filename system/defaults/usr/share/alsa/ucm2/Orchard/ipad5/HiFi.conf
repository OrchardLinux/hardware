# The speakers and the two built-in DMICs of the CS42L81; gains stay at the
# driver's defaults. Headphones are left out until the codec's plug detect
# is known and the headphone path is validated (the driver's "Output Select"
# picks the output by hand until then).
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Output Select' Speakers"
		cset "name='Speaker Playback Switch' on"
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
		cset "name='Speaker Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='Capture Switch' on"
	]
	DisableSequence [
		cset "name='Capture Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
	}
}
