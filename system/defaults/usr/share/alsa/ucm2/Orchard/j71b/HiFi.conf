# The four speakers on MCA2 through MAX98357A amplifiers: no hardware volume
# (PipeWire's software volume applies), one pin switch from simple-audio-card.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
